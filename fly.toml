app = "duitok-ai-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  SERVE_STATIC = "false"
  DATA_DIR = "/data"

[http_service]
  internal_port = 4173
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "duitok_data"
  destination = "/data"
