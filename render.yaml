services:
  - type: web
    name: pokaya-ai
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "true"
      - key: DATA_DIR
        value: /var/data
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_TOKEN_TTL_MS
        value: "604800000"
      - key: USER_GENERATE_PER_MINUTE
        value: "3"
      - key: USER_GENERATE_PER_DAY
        value: "50"
      - key: MAX_CONCURRENT_GENERATION_JOBS
        value: "2"
      - key: USER_CONCURRENT_GENERATIONS
        value: "1"
      - key: THUMBNAIL_CACHE_MAX_ITEMS
        value: "80"
      - key: THUMBNAIL_CACHE_MAX_BYTES
        value: "33554432"
      - key: JSON_BODY_LIMIT
        value: 32mb
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://pokaya.ai,https://www.pokaya.ai
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://pokaya.ai/api/auth/google/callback
      - key: CHIP_API_TOKEN
        sync: false
      - key: CHIP_BRAND_ID
        sync: false
      - key: CHIP_PUBLIC_KEY
        sync: false
      - key: APIMART_API_KEY
        sync: false
      - key: APIMART_BASE_URL
        value: https://api.apimart.ai
      - key: APIMART_CHAT_PATH
        value: /v1/chat/completions
      - key: APIMART_IMAGE_PATH
        value: /v1/images/generations
      - key: APIMART_VIDEO_PATH
        value: /v1/videos/generations
      - key: APIMART_TASK_PATH_PREFIX
        value: /v1/tasks
      - key: APIMART_POLL_ATTEMPTS
        value: "60"
      - key: APIMART_POLL_MS
        value: "5000"
      - key: GPT_IMAGE_GENERATION_TIMEOUT_MS
        value: "360000"
      - key: GPT_IMAGE_APIMART_ATTEMPT_TIMEOUT_MS
        value: "360000"
      - key: APIMART_TEXT_MODEL
        value: gpt-5-mini
      - key: APIMART_IMAGE_MODEL
        value: gpt-image-2
      - key: APIMART_NANO_BANANA_PRO_MODEL
