services:
  - type: web
    name: duitok-ai
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "true"
      - key: DATA_DIR
        value: /var/data
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_TOKEN_TTL_MS
        value: "604800000"
      - key: USER_GENERATE_PER_MINUTE
        value: "3"
      - key: USER_GENERATE_PER_DAY
        value: "50"
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ORIGINS
        value: ""
      - key: CHIP_API_TOKEN
        sync: false
      - key: CHIP_BRAND_ID
        sync: false
      - key: CHIP_PUBLIC_KEY
        sync: false
      - key: APIMART_API_KEY
        sync: false
      - key: APIMART_BASE_URL
        value: https://api.apimart.ai
      - key: APIMART_CHAT_PATH
        value: /v1/chat/completions
      - key: APIMART_IMAGE_PATH
        value: /v1/images/generations
      - key: APIMART_TASK_PATH_PREFIX
        value: /v1/tasks
      - key: APIMART_TEXT_MODEL
        value: gpt-5-mini
      - key: APIMART_IMAGE_MODEL
        value: gpt-image-2
      - key: APIMART_IMAGE_SIZE
        value: 1:1
      - key: APIMART_IMAGE_RESOLUTION
        value: 1K
      - key: GRSAI_API_KEY
        sync: false
      - key: GRSAI_BASE_URL
        value: https://grsaiapi.com
      - key: GRSAI_DRAW_PATH
        value: /v1/draw/nano-banana
      - key: GRSAI_RESULT_PATH
        value: /v1/draw/result
      - key: GRSAI_NANO_MODEL
        value: nano-banana-pro
      - key: GRSAI_NANO_ASPECT_RATIO
        value: 1:1
      - key: GRSAI_NANO_IMAGE_SIZE
        value: 1K
      - key: GRSAI_IMAGE_POLL_ATTEMPTS
        value: "36"
      - key: GRSAI_IMAGE_POLL_MS
        value: "3000"
      - key: WUYIN_API_KEY
        sync: false
      - key: WUYIN_BASE_URL
        value: https://api.wuyinkeji.com
      - key: WUYIN_IMAGE_SIZE
        value: 1K
      - key: WUYIN_IMAGE_ASPECT_RATIO
        value: 1:1
      - key: WUYIN_VIDEO_MODEL
        value: veo3.1-fast
      - key: WUYIN_VIDEO_RATIO
        value: 9:16
      - key: WUYIN_VEO_SIZE
        value: 720p
      - key: WUYIN_SORA_ASPECT_RATIO
        value: 9:16
      - key: WUYIN_SORA_DURATION
        value: "10"
      - key: WUYIN_SORA_SIZE
        value: small
      - key: WUYIN_OMNI_DURATION
        value: "10"
      - key: WUYIN_OMNI_SIZE
        value: 720x1280
      - key: WUYIN_GROK_DURATION
        value: "10"
      - key: WUYIN_GROK_ASPECT_RATIO
        value: 9:16
      - key: ASSET_STORAGE_PROVIDER
        value: external
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
    disk:
      name: duitok-data
      mountPath: /var/data
      sizeGB: 1
