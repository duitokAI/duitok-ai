services:
  - type: web
    name: duitok-ai
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "true"
      - key: DATA_DIR
        value: /var/data
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ORIGINS
        value: ""
      - key: CHIP_API_TOKEN
        sync: false
      - key: CHIP_BRAND_ID
        sync: false
      - key: CHIP_PUBLIC_KEY
        sync: false
      - key: APIMART_API_KEY
        sync: false
      - key: APIMART_BASE_URL
        value: https://api.apimart.ai
      - key: APIMART_CHAT_PATH
        value: /v1/chat/completions
      - key: APIMART_IMAGE_PATH
        value: /v1/images/generations
      - key: APIMART_TASK_PATH_PREFIX
        value: /v1/tasks
      - key: APIMART_TEXT_MODEL
        value: gpt-5-mini
      - key: APIMART_IMAGE_MODEL
        value: gpt-image-2
      - key: APIMART_IMAGE_SIZE
        value: 1:1
      - key: APIMART_IMAGE_RESOLUTION
        value: 1K
      - key: WUYIN_API_KEY
        sync: false
      - key: WUYIN_BASE_URL
        value: https://api.wuyinkeji.com
      - key: WUYIN_IMAGE_SIZE
        value: 1K
      - key: WUYIN_IMAGE_ASPECT_RATIO
        value: 1:1
      - key: WUYIN_VIDEO_MODEL
        value: veo3.1-fast
      - key: WUYIN_VIDEO_RATIO
        value: 9:16
      - key: WUYIN_SORA_ASPECT_RATIO
        value: 9:16
      - key: WUYIN_SORA_DURATION
        value: "10"
      - key: WUYIN_SORA_SIZE
        value: small
      - key: WUYIN_OMNI_DURATION
        value: "10"
      - key: WUYIN_OMNI_SIZE
        value: 720x1280
    disk:
      name: duitok-data
      mountPath: /var/data
      sizeGB: 1
