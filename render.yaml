        value: "5"
      - key: APIMART_SEEDANCE_RESOLUTION
        value: 1080p
      - key: APIMART_SEEDANCE_GENERATE_AUDIO
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_CHAT_PATH
        value: /chat/completions
      - key: DEEPSEEK_MODEL
