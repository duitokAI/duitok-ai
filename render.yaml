      - key: REQUIRE_DURABLE_ASSETS
        value: "true"
      - key: ADMIN_USER_IDS
        value: u_1
      - key: ADMIN_EMAILS
        value: admin@pokaya.ai
      - key: ADMIN_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
    disk:
      name: pokaya-data
      mountPath: /var/data
      sizeGB: 1
